[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plate_core"
version = "0.1.0"
description = "Licence plate specs, themes, validators and renderers; country packages build on it."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/ArAd1Beyranvand/plate-core"

[tool.setuptools.packages.find]
include = ["plates*"]
exclude = ["plates.countries.*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
