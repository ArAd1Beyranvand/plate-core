name: plate_alphabet
description: "Ready-made digit and letter alphabets for licence plate keypads — shared across countries, subset by each as needed."
version: 0.1.2
repository: https://github.com/ArAd1Beyranvand/plate-alphabet/tree/main/flutter
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  # The country-neutral alphabet and slot definitions.
  plate_core: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
