name: venezuela_plate
description: "Venezuela's licence plate for the plate_core library — the 2008 car plate with the flag background, the state-code alphabets and the advisory category validator."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/venezuela-plate/tree/main/flutter
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  # 0.11.2 for PlateFill.stripes.
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No assets. The flag is painted as background stripes; the stars and the
# microprint on the characters are not approximated.
