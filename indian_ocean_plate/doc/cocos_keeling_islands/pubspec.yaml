name: cocos_keeling_islands_plate
description: "Cocos (Keeling) Islands's licence plates for the plate_core library — the general-issue plate (blue on pale grey, `C · 400`), its theme, Latin alphabets and an advisory validator."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
