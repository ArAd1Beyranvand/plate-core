name: senegal_plate
description: "Senegal's licence plates for the plate_core library — the 1989–2019 blue plate and the current white plates (front, truck rear, motorcycle) with their themes, alphabets and an advisory validator."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.5
  plate_alphabet: ^0.1.0

flutter:
  assets:
    - assets/flags/Flag_of_Senegal.svg

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
