name: plate_core
description: "The backbone of license plate packages for countries that actually exist (we checked)."
version: 0.11.5
repository: https://github.com/ArAd1Beyranvand/plate-core
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The one asset the core ships is the EU band's twelve stars, shared by every
# EU country package (`SvgPlateAsset(..., package: 'plate_core')`). Anything
# country-specific belongs to the package that names it.
flutter:
  assets:
    - assets/flags/Flag_of_Europe.svg
