name: yemen_plate
description: "Yemen's licence plates for the plate_core library — the 2026 unified specs, the 1993 northern specs, the alphabets, the usage themes and the advisory validators."
version: 0.3.0
homepage: https://github.com/ArAd1Beyranvand/plate-yemen
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.5
  # Shared alphabet definitions.
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Two assets: Aden's lighthouse, cropped from the CC0 Wikipedia artwork
# (User:BasilLeaf), and the Riyadh strip's emblem (Wikimedia, one ink). Both
# are named with `package: 'yemen_plate'`, so the literals and this block move
# together. The eagle emblem on the 2026 unified plate is still not shipped — see
# "What it does not ship" in the README.
flutter:
  assets:
    - assets/southern/aden_lighthouse.png
    - assets/riyadh/emblem.svg
#
# No font either. Both systems are set in faces this package does not have the
# rights to redistribute — see the README's "Fonts". The example bundles a
# clearly labelled substitute; the package itself names no font family, so a
# host's own theme reaches the plate.
