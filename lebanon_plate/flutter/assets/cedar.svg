<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cedar of Lebanon - stylized silhouette centered -->
  <g id="cedar" fill="#ffffff">
    <!-- Trunk -->
    <rect x="45" y="65" width="10" height="25" rx="2"/>

    <!-- Foliage layers (conical shape, bottom to top) -->
    <polygon points="50,15 25,35 75,35"/>
    <polygon points="50,28 20,50 80,50"/>
    <polygon points="50,42 15,65 85,65"/>

    <!-- Internal texture for depth -->
    <path d="M 50 20 Q 40 28 38 35 Q 35 42 40 48 Q 45 52 50 50 Q 55 52 60 48 Q 65 42 62 35 Q 60 28 50 20"
          fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
    <path d="M 50 35 Q 35 45 32 55 Q 30 60 35 65 Q 50 70 65 65 Q 70 60 68 55 Q 65 45 50 35"
          fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  </g>
</svg>
