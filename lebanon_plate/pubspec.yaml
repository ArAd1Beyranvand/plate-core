name: lebanon_plate
description: "Lebanon's licence plates for the plate_core library — the one-line and two-line specs, the letter and digit alphabets, the eight usage colour themes and the advisory validator."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/lebanon-plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  # The country-neutral engine. The only dependency, and deliberately so: not
  # any other country's package.
  plate_core: ^0.11.5
  # Shared alphabet definitions.
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/cedar.svg

# No font. `PlateTheme` names no font family and `plate_core` offers no
# hook to give one to a label, so a font bundled here could not reach the لبنان
# on the band. Supplying a face to the subtree is the host's job, via its own
# `Theme` / `DefaultTextStyle`.
