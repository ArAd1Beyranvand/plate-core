<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Darul Aman Palace, as it is printed in the block at the hoist end of
  every Afghan licence plate: a symmetric neoclassical facade, a clock tower
  over the centre, colonnaded wings, and the forecourt ramp running away from
  the steps.

  Stylised line art, drawn for this package from the plate photographs on
  Wikipedia rather than traced from any one of them. It is a plate emblem, not
  an architectural elevation: it is printed about 20 px tall, so anything finer
  than the strokes below would close up into a smudge at plate scale.

  This is the DARK variant, for the black ink of a white, yellow or blue plate.
  Darul_Aman_light.svg is the same drawing in white, for the diplomatic red and
  governmental black fields. The two exist because `PlateFlag` paints an asset
  as it is and takes no colour filter — a country's flag is never recoloured,
  and an emblem that has to be is two assets rather than a hole in that rule.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 128" width="200" height="128">
  <g fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- Clock tower: shaft, cornice, lantern and finial over the centre bay. -->
    <path d="M88 60 V18 h24 v42"/>
    <path d="M85 18 h30"/>
    <path d="M92 18 V12 h16 v6"/>
    <path d="M100 12 V4"/>
    <circle cx="100" cy="30" r="6"/>

    <!-- Centre bay: the tower's base, carried down to the terrace. -->
    <path d="M80 60 h40 v34 h-40 z"/>
    <path d="M78 60 h44"/>
    <path d="M94 94 V72 a6 6 0 0 1 12 0 v22"/>

    <!-- Wings: an entablature over a five-bay arcade, left and right. -->
    <path d="M26 66 h54 M120 66 h54"/>
    <path d="M26 66 v28 h54 M174 66 v28 h-54"/>

    <!-- Left arcade. -->
    <path d="M33 94 V78 a4.5 4.5 0 0 1 9 0 v16"/>
    <path d="M48 94 V78 a4.5 4.5 0 0 1 9 0 v16"/>
    <path d="M63 94 V78 a4.5 4.5 0 0 1 9 0 v16"/>

    <!-- Right arcade. -->
    <path d="M128 94 V78 a4.5 4.5 0 0 1 9 0 v16"/>
    <path d="M143 94 V78 a4.5 4.5 0 0 1 9 0 v16"/>
    <path d="M158 94 V78 a4.5 4.5 0 0 1 9 0 v16"/>

    <!-- End pavilions, a storey shallower than the wings. -->
    <path d="M14 72 h12 M186 72 h-12"/>
    <path d="M14 72 v22 M186 72 v22"/>

    <!-- Terrace, and the balustraded ramp down to the forecourt. -->
    <path d="M10 94 h180"/>
    <path d="M10 100 h180"/>
    <path d="M62 100 L44 122 M138 100 L156 122"/>
    <path d="M44 122 h112"/>
    <path d="M70 106 h60 M76 112 h48"/>
  </g>
</svg>
