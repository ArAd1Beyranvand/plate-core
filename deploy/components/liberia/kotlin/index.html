<body>
<div id="splash"><h1>Liberia license plates in Kotlin</h1><p>The library draws 1 plate format for Liberia, among them Diplomatic. A typical registration reads 1CD13. This page runs the Kotlin port: type a registration and watch the plate take shape and get checked as you go.</p><p id="splash-status">Starting Kotlin…</p></div>
<div id="app"></div>
<script>
// One build only (W5): Wasm when WasmGC validates, JS IR otherwise. `?build=js|wasm` forces one (tests).
// A classic script, not import(): webpack's runtime finds its asset path through document.currentScript.
var gc = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,95,1,120,0]);
var forced = new URLSearchParams(location.search).get('build');
var wasm = forced ? forced === 'wasm' : WebAssembly.validate(gc);
var tag = document.createElement('script');
tag.src = wasm ? './wasm-7720f31b95/plates.js' : './js-4a636fc8e5/plates.js';
tag.onerror = function () {
  document.getElementById('splash-status').textContent = 'Could not start Kotlin.';
  parent.postMessage({ ns: 'plate-embed', v: 1, type: 'error', payload: { code: 'load_failed', message: 'could not load ' + tag.src, fatal: true } }, '' || location.origin);
};
document.body.appendChild(tag);
</script>
