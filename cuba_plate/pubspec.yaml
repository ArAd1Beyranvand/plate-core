name: cuba_plate
description: "Cuba's licence plates for plate_core: the 2013 car plate (natural-person and legal-entity strips) and motorcycle plate, with alphabet and advisory validator."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/cuba-plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  # Shared alphabet definitions.
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No assets. A Cuban plate carries no flag; its country mark is the word CUBA,
# which the specs print as a label. The laser-printed island hologram on the
# real plate is a security feature, not artwork worth approximating.
