<!doctype html>
<html lang="en">
<head>
<base href="$FLUTTER_BASE_HREF">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<style>
  html,body{margin:0;background:transparent;font:16px system-ui,sans-serif;color:#202124}
  @media (prefers-color-scheme:dark){html,body{color:#e8eaed}}
  #splash{display:flex;flex-direction:column;gap:4px;padding:16px}
  #splash h1{font-size:18px;margin:0}
  #splash p{margin:0;opacity:.7}
</style>
</head>
<body>
<div id="splash"><h1>{{h1}}</h1><p>{{text}}</p><p>Starting Flutter…</p></div>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
