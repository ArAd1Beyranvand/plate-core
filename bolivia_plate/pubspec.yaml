name: bolivia_plate
description: "Bolivia's licence plates for plate_core: standard, diplomatic, consular and Mercosur plates, with themes, alphabets and advisory validators."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/bolivia-plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.5
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/flags/Flag_of_Bolivia_state.svg
