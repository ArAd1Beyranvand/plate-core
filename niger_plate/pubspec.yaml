name: niger_plate
description: "Niger's licence plates for the plate_core library — the 2005 series (region digit, series letter, four-digit serial, country map and RN) in its private and commercial liveries, with themes, alphabets and advisory validators."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/niger-plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.5
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/maps/niger_map.svg
    - assets/maps/niger_map_flag.svg
    - assets/maps/niger_flag.svg
