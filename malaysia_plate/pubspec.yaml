name: malaysia_plate
description: "Malaysia's licence plates for plate_core: single-row and two-row JPJ plates, the diplomatic plate and JPJePlate, with themes, alphabets and an advisory validator."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/malaysia-plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.5
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/flags/Flag_of_Malaysia.svg
