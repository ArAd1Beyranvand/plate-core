name: colombia_plate
description: "Colombia's licence plates for the plate_core library — the `ABC·123` plate in its private, public-service, official, antique, mototaxi, trailer, tank-truck and diplomatic-staff liveries, the new diplomatic-corps plate and the National Police plate, with their themes, alphabets and advisory validators."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/colombia-plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.5
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
