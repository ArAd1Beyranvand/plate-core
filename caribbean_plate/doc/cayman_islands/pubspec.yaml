name: cayman_islands_plate
description: "The Cayman Islands' licence plates for the plate_core library — private, disabled, heavy-goods, hire and taxi plates, five themes, digits, advisory validators."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
