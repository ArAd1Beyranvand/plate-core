name: tunisia_plate
description: "Tunisia's licence plates for plate_core: one- and two-line, rental, government, diplomatic, military and temporary plates, with themes, alphabets and validators."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/tunisia-plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.5
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/flags/Flag_of_Tunisia.svg
    - assets/tn_military_flag.png
  # Amiri Bold (OFL, assets/fonts/Amiri-OFL.txt), subset to the four letters
  # of تونس: the plates stamp the word in a Naskh hand.
  fonts:
    - family: TunisiaAmiri
      fonts:
        - asset: assets/fonts/Amiri-Bold-tunis.ttf
          weight: 700
